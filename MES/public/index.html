<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MES Performance Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .card {
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            padding: 20px;
            margin-bottom: 20px;
        }
        .chart-container {
            position: relative;
            height: 400px;
            width: 100%;
        }
        .status-bar {
            display: flex;
            justify-content: space-between;
            background: #2c3e50;
            color: white;
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: bold;
        }
        .btn-refresh {
            background: #3498db;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-refresh:hover {
            background: #2980b9;
        }
        .error-log {
            color: #e74c3c;
            font-size: 0.9em;
            margin-top: 10px;
            max-height: 100px;
            overflow-y: auto;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>MES System Performance Dashboard</h1>
        <p>Real-time monitoring for Web Server, Database, FTP & Node-RED</p>
    </div>

    <div class="status-bar">
        <div>
            <span id="last-updated" style="margin-right: 20px;">Last Updated: Loading...</span>
            <select id="timeRange" onchange="fetchData()" style="padding: 5px; border-radius: 4px; font-weight: bold;">
                <option value="4h">Last 4 Hours (High Res)</option>
                <option value="24h">Last 24 Hours</option>
                <option value="7d">Last 7 Days</option>
                <option value="30d">Last 30 Days</option>
            </select>
        </div>
        <button class="btn-refresh" onclick="fetchData()">Refresh Now</button>
    </div>

    <div class="card">
        <h2>Unified System Latency & Resource Usage</h2>
        <p style="font-size: 0.9em; color: #7f8c8d; margin-top: -10px;">Click on the legend items below to hide/show specific metrics.</p>
        <div class="chart-container" style="height: 600px;">
            <canvas id="mainChart"></canvas>
        </div>
        <div id="errorBox" class="error-log"></div>
    </div>
</div>

<script>
    let mainChart;

    function initCharts() {
        const ctx = document.getElementById('mainChart').getContext('2d');

        mainChart = new Chart(ctx, {
            type: 'line',
            data: { 
                labels: [], 
                datasets: [
                    {
                        label: 'Ping (ms)',
                        data: [],
                        borderColor: '#2ecc71',
                        backgroundColor: 'transparent',
                        borderWidth: 2,
                        tension: 0.3
                    },
                    {
                        label: 'Web HTTP (ms)',
                        data: [],
                        borderColor: '#3498db',
                        backgroundColor: 'transparent',
                        borderWidth: 2,
                        tension: 0.3
                    },
                    {
                        label: 'DB Connect (ms)',
                        data: [],
                        borderColor: '#e67e22',
                        backgroundColor: 'transparent',
                        borderWidth: 2,
                        borderDash: [5, 5],
                        tension: 0.3
                    },
                    {
                        label: 'DB Query (ms)',
                        data: [],
                        borderColor: '#e74c3c',
                        backgroundColor: 'transparent',
                        borderWidth: 2,
                        tension: 0.3
                    },
                    {
                        label: 'Node-RED (ms)',
                        data: [],
                        borderColor: '#9b59b6',
                        backgroundColor: 'transparent',
                        borderWidth: 2,
                        tension: 0.3
                    },
                    {
                        label: 'FTP Port 21 (ms)',
                        data: [],
                        borderColor: '#34495e',
                        backgroundColor: 'transparent',
                        borderWidth: 2,
                        borderDash: [5, 5],
                        tension: 0.3
                    },
                    {
                        label: 'OS RAM Usage (%)',
                        data: [],
                        borderColor: '#c0392b',
                        backgroundColor: 'rgba(192, 57, 43, 0.1)',
                        borderWidth: 2,
                        tension: 0.3,
                        fill: true,
                        yAxisID: 'y1'
                    }
                ] 
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                interaction: {
                    mode: 'index',
                    intersect: false,
                },
                plugins: {
                    tooltip: {
                        position: 'nearest',
                    }
                },
                scales: {
                    x: {
                        display: true,
                        title: { display: true, text: 'Time' }
                    },
                    y: {
                        display: true,
                        position: 'left',
                        title: { display: true, text: 'Latency / Response Time (ms)' },
                        beginAtZero: true
                    },
                    y1: {
                        type: 'linear',
                        display: true,
                        position: 'right',
                        title: { display: true, text: 'RAM Percentage (%)' },
                        min: 0,
                        max: 100,
                        grid: { drawOnChartArea: false }
                    }
                }
            }
        });
    }

    async function fetchData() {
        try {
            const range = document.getElementById('timeRange').value;
            const res = await fetch('/api/data?range=' + range);
            const result = await res.json();
            
            if (!result.success) {
                document.getElementById('last-updated').innerText = 'Error: ' + result.error;
                return;
            }

            const data = result.data;
            if (data.length === 0) return;

            // Format labels
            const labels = data.map(d => {
                const date = new Date(d.timestamp);
                return date.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            });

            // Prepare datasets
            const pingData = data.map(d => d.ping);
            const httpData = data.map(d => d.http);
            const dbConnectData = data.map(d => d.dbConnect);
            const dbQueryData = data.map(d => d.dbQuery);
            const ftpData = data.map(d => d.ftp);
            const noderedData = data.map(d => d.nodered);
            const ramData = data.map(d => d.ram);
            
            // Extract errors
            const errors = data.filter(d => d.error).map(d => `[${new Date(d.timestamp).toLocaleTimeString()}] ${d.error}`);
            
            // Update Unified Chart
            mainChart.data.labels = labels;
            mainChart.data.datasets[0].data = pingData;
            mainChart.data.datasets[1].data = httpData;
            mainChart.data.datasets[2].data = dbConnectData;
            mainChart.data.datasets[3].data = dbQueryData;
            mainChart.data.datasets[4].data = noderedData;
            mainChart.data.datasets[5].data = ftpData;
            mainChart.data.datasets[6].data = ramData;
            mainChart.update();
            
            // Update Status
            const lastRecord = data[data.length - 1];
            document.getElementById('last-updated').innerText = `Last Updated: ${new Date(lastRecord.timestamp).toLocaleTimeString()}`;
            
            // Update Errors
            const errorBox = document.getElementById('errorBox');
            if (errors.length > 0) {
                errorBox.innerHTML = '<strong>Recent Errors:</strong><br>' + errors.slice(-5).join('<br>');
            } else {
                errorBox.innerHTML = '';
            }

        } catch (err) {
            console.error("Failed to fetch data:", err);
            document.getElementById('last-updated').innerText = 'Connection to server failed.';
        }
    }

    // Run on load
    window.onload = () => {
        initCharts();
        fetchData();
        // Auto refresh every 10 seconds
        setInterval(fetchData, 10000);
    };
</script>

</body>
</html>
